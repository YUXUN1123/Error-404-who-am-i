<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERROR 404：這台電腦不記得自己是誰</title>

<!-- =====================================================================
  《ERROR 404：這台電腦不記得自己是誰》
  單一檔案版本：CSS 寫在 <style>，JavaScript 寫在 <script>。

  給初學者的閱讀地圖：
    1. <style>  ......... 畫面長相（顏色、視窗、動畫）
    2. <body>   ......... 網頁骨架（開機畫面、桌面、工作列）
    3. <script> ......... 遊戲邏輯
         ├─ GAME_DATA ... 所有台詞、答案、檔案內容（想改劇情只改這裡）
         ├─ state ....... 遊戲進度與玩家選擇
         └─ 其餘 ......... ECHO 說話、視窗、謎題、終端機、結局
====================================================================== -->

<link rel="stylesheet" href="style.css">
</head>

<body data-stage="0">
<noscript>這個遊戲需要開啟 JavaScript 才能遊玩。</noscript>

<!-- ======================================================================
     HTML 骨架
     ====================================================================== -->

<!-- 開機畫面 -->
<div id="boot">
  <p id="bootStory">你回到一台放了約三個月沒開的舊電腦前。<br>說不清楚自己為什麼一直沒碰它。</p>
  <button id="startBtn" type="button">點擊開始</button>
  <pre id="bootLog" hidden></pre>
  <div id="bootErr" hidden>ERROR 404<small>找不到使用者</small></div>
  <div class="bootskip" id="bootSkip" hidden>點擊畫面可略過</div>
</div>

<!-- 桌面 -->
<div id="desktop">
  <div id="sysname" class="glitch">████</div>
  <div id="whispers"></div>
  <nav id="icons" aria-label="桌面圖示">
    <button class="icon" data-act="open" data-id="mycomputer" type="button"><span class="ico">🖥️</span><span class="lbl">我的電腦</span></button>
    <button class="icon" data-act="open" data-id="memory" id="memIcon" type="button"><span class="ico">🔒</span><span class="lbl">我的記憶</span></button>
    <button class="icon" data-act="open" data-id="recycle" type="button"><span class="ico">🗑️</span><span class="lbl">回收桶</span></button>
    <button class="icon" data-act="open" data-id="browser" type="button"><span class="ico">🌐</span><span class="lbl">瀏覽器</span></button>
    <button class="icon" data-act="open" data-id="sticky" type="button"><span class="ico">📝</span><span class="lbl">便利貼</span></button>
    <button class="icon" data-act="open" data-id="terminal" type="button"><span class="ico">⌨️</span><span class="lbl">終端機</span></button>
    <button class="icon" data-act="open" data-id="auth" type="button"><span class="ico">🪪</span><span class="lbl">身份驗證</span></button>
    <button class="icon" data-act="open" data-id="report" type="button"><span class="ico">⚠️</span><span class="lbl">錯誤報告</span></button>
    <button class="icon" data-act="open" data-id="chat" type="button"><span class="ico">💬</span><span class="lbl">對話</span></button>
    <button class="icon" data-act="open" data-id="memgame" type="button"><span class="ico">🧩</span><span class="lbl">記憶修復</span></button>
    <button class="icon" data-act="open" data-id="music" type="button"><span class="ico">🎵</span><span class="lbl">音樂</span></button>
    <button class="icon" data-act="open" data-id="album" type="button"><span class="ico">🖼️</span><span class="lbl">相簿</span></button>
  </nav>
  <div id="popups"></div>
</div>

<!-- 強制選擇視窗 -->
<div id="modal" hidden></div>

<!-- ECHO 對話框 -->
<div id="echo" hidden>
  <div class="echo-head"><b>ECHO</b><span>訊號 <span id="sig">▮▯▯▯</span></span></div>
  <div id="echoText" aria-live="polite"></div>
  <div class="echo-foot">點擊可略過 ▸</div>
</div>

<!-- 工作列 -->
<div id="taskbar">
  <button id="helpBtn" type="button">❓ 求助</button>
  <button id="muteBtn" type="button" title="開關音效" aria-label="開關音效">🔊</button>
  <button id="achBtn" type="button" title="成就">🏆 0/12</button>
  <div id="meter"><span class="lb">記憶完整度</span><div class="bar"><i id="barfill"></i></div><b id="pct">12%</b></div>
  <span id="clock">03:12</span>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="flash"></div>
<div id="ending" hidden></div>

<script src="script.js"></script>
</body>
</html>
