
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERROR 404 — A Lost Memory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 開場空間 -->
  <section id="intro" class="scene">
    <div class="room-glow"></div>

    <div class="room">
      <div class="room-title">SOMEWHERE IN MEMORY</div>

      <div class="desk">
        <div class="monitor" id="startComputer" title="點擊電腦">
          <div class="monitor-screen">
            <span class="screen-star">✦</span>
            <span id="screenText">waiting...</span>
            <span class="screen-cursor">_</span>
          </div>
          <div class="monitor-neck"></div>
          <div class="monitor-base"></div>
        </div>

        <div class="desk-top"></div>
        <div class="desk-leg left-leg"></div>
        <div class="desk-leg right-leg"></div>
      </div>

      <div class="intro-hint" id="introHint">
        點擊電腦，看看裡面有什麼
      </div>
      <div class="intro-version">ERROR 404 · MEMORY SYSTEM</div>
    </div>
  </section>

  <!-- 電腦桌面 -->
  <main id="desktop" class="desktop hidden">
    <div class="wallpaper-orb"></div>

    <div class="desktop-heading">
      <div class="system-name">MEMORY OS <span>v.04</span></div>
      <div id="clock">03:14</div>
    </div>

    <div class="desktop-icons">
      <button class="desktop-icon" data-file="computer">
        <span class="icon-art">🖥️</span>
        <span>我的電腦</span>
      </button>

      <button class="desktop-icon" data-file="memories">
        <span class="icon-art">📁</span>
        <span>我的記憶</span>
      </button>

      <button class="desktop-icon" data-file="messages">
        <span class="icon-art">💌</span>
        <span>訊息紀錄</span>
      </button>

      <button class="desktop-icon" data-file="recycle">
        <span class="icon-art">🗑️</span>
        <span>資源回收桶</span>
      </button>

      <button class="desktop-icon" data-file="terminal">
        <span class="icon-art">⌨️</span>
        <span>終端機</span>
      </button>

      <button class="desktop-icon" data-file="mystery">
        <span class="icon-art">✨</span>
        <span>新檔案</span>
      </button>
    </div>

    <div id="desktopMessage" class="desktop-message">
      歡迎回來。咦……你是誰？
    </div>

    <!-- 檔案視窗 -->
    <section id="fileWindow" class="window hidden">
      <header class="window-bar" id="windowBar">
        <span id="windowTitle">檔案</span>
        <button id="closeWindow" aria-label="關閉視窗">×</button>
      </header>
      <div id="windowContent" class="window-content"></div>
    </section>

    <!-- 終端機視窗 -->
    <section id="terminalWindow" class="window terminal-window hidden">
      <header class="window-bar" id="terminalBar">
        <span>MEMORY TERMINAL</span>
        <button id="closeTerminal" aria-label="關閉終端機">×</button>
      </header>
      <div id="terminalOutput" class="terminal-output">
        MEMORY OS TERMINAL<br>
        輸入 help 查看可用指令。<br><br>
      </div>
      <form id="terminalForm" class="terminal-form">
        <span>&gt;</span>
        <input id="terminalInput" autocomplete="off"
          placeholder="輸入指令..." aria-label="終端機指令">
        <button type="submit">執行</button>
      </form>
    </section>

    <!-- 系統提示 -->
    <div id="toast" class="toast"></div>

    <!-- 劇情選擇 -->
    <div id="choiceModal" class="overlay hidden">
      <div class="dialog">
        <div class="dialog-label">SYSTEM MESSAGE</div>
        <h2 id="choiceTitle">要怎麼做？</h2>
        <p id="choiceText"></p>
        <div id="choiceButtons" class="choice-buttons"></div>
      </div>
    </div>

    <!-- 結局 -->
    <div id="endingScreen" class="overlay hidden">
      <div class="dialog ending-dialog">
        <div class="dialog-label">END OF MEMORY</div>
        <h1 id="endingTitle"></h1>
        <p id="endingText"></p>
        <button id="restartButton" class="primary-button">重新開始</button>
      </div>
    </div>

    <footer class="taskbar">
      <div class="taskbar-brand">✦ MEMORY OS</div>
      <div id="taskbarStatus">系統正常 · 等待探索</div>
      <button id="helpButton">使用說明</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
