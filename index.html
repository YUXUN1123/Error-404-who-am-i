
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERROR 404：這台電腦不記得自己是誰</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 開機首頁 -->
  <section id="bootScreen" class="boot-screen">
    <div class="boot-logo">ECHO<span class="glitch">_</span></div>
    <p>MEMORY SYSTEM / VERSION 0.7.09</p>
    <p id="bootText">正在等待使用者……</p>
    <button id="startButton">點擊開始</button>
  </section>

  <!-- 遊戲桌面 -->
  <main id="desktop" class="desktop hidden">
    <div class="desktop-top">
      <span id="chapterLabel">CHAPTER 01 / 啟動</span>
      <span id="userLabel">USER: UNKNOWN</span>
    </div>

    <!-- 桌面圖示由 JavaScript 產生 -->
    <section id="iconArea" class="icon-area"></section>

    <!-- 固定任務提示：讓玩家知道下一步 -->
    <aside id="taskPanel" class="task-panel">
      <div class="panel-heading">
        <span>▸ CURRENT MISSION</span>
        <span class="live-dot"></span>
      </div>
      <h2 id="taskTitle">調查電腦異常</h2>
      <p id="taskDescription">
        這台電腦似乎忘記了某些事情。先看看桌面上的檔案。
      </p>
      <p id="taskHint" class="task-hint">提示：試著打開「我的電腦」。</p>
      <button id="helpButton" class="small-button">向 ECHO 求助</button>
    </aside>

    <!-- 記憶完整度與工作列 -->
    <footer class="taskbar">
      <div class="taskbar-brand">ECHO OS</div>
      <div class="memory-meter">
        <span>記憶完整度</span>
        <div class="meter-track">
          <div id="meterFill" class="meter-fill" style="width:12%"></div>
        </div>
        <span id="meterText">12%</span>
      </div>
      <span id="clock">03:12</span>
      <button id="restartButton" class="small-button">重新開始</button>
    </footer>

    <!-- 電腦視窗 -->
    <section id="windowLayer" class="window-layer"></section>

    <!-- ECHO 對話框 -->
    <aside id="echoBox" class="echo-box">
      <div class="echo-heading">
        <span class="echo-symbol">E</span>
        <div>
          <strong>ECHO</strong>
          <small id="echoStatus">MEMORY RECOVERY MODE</small>
        </div>
      </div>
      <p id="echoText">……有人嗎？</p>
      <button id="echoContinue" class="text-button hidden">繼續 ▸</button>
    </aside>

    <!-- 劇情彈窗與選擇視窗 -->
    <div id="modalLayer" class="modal-layer hidden"></div>
  </main>

  <!-- 結局畫面 -->
  <section id="endingScreen" class="ending-screen hidden">
    <div class="ending-content">
      <p id="endingCode" class="ending-code">SYSTEM / END</p>
      <h1 id="endingTitle">記憶已處理</h1>
      <div id="endingText"></div>
      <div id="choiceRecord" class="choice-record"></div>
      <button id="endingRestart" class="primary-button">重新開始</button>
    </div>
  </section>

  <script src="game.js"></script>
</body>
</html>
