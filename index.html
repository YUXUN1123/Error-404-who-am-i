<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第 0 號玩家：遺失的昨日</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div>
    <small>MEMORY ROOM / 000</small>
    <h1>第 0 號玩家：遺失的昨日</h1>
  </div>
  <button id="restartBtn">重新開始</button>
</header>

<section id="intro" class="intro">
  <div class="intro-card">
    <span class="tag">INTERACTIVE STORY</span>
    <h2>如果昨天消失了，<br>你還會是原本的你嗎？</h2>
    <p>
      你在一間陌生的房間醒來。<br>
      窗外陽光正好，桌上的電腦卻顯示：
    </p>
    <div class="intro-message">
      歡迎回來，玩家 0。<br>
      昨日記憶備份未完成。<br>
      請完成修復程序。
    </div>
    <button id="startBtn" class="primary">進入房間 →</button>
  </div>
</section>

<main id="game" class="hidden">

  <section class="story-bar">
    <div>
      <span class="tag" id="chapter">CHAPTER 01</span>
      <h2 id="chapterTitle">陌生的房間</h2>
      <p id="storyText">
        房間裡有幾樣物品。也許它們能告訴你發生了什麼。
      </p>
    </div>
    <div class="progress">
      <span>記憶修復</span>
      <strong id="progressText">0%</strong>
      <div class="progress-track">
        <div id="progressFill"></div>
      </div>
    </div>
  </section>

  <div class="layout">

    <section class="room">
      <div class="window">
        <div class="sun"></div>
        <div class="window-line"></div>
      </div>

      <button class="room-object clock" data-object="clock">
        <span class="clock-face">10:15</span>
        <span class="object-label">時鐘</span>
      </button>

      <button class="room-object picture" data-object="picture">
        <span class="picture-art">✦</span>
        <span class="object-label">相框</span>
      </button>

      <div class="desk"></div>

      <button class="room-object computer" data-object="computer">
        <span class="monitor">
          <span>MEMORY OS</span>
          <span class="monitor-icon">✿</span>
        </span>
        <span class="object-label">電腦</span>
      </button>

      <button class="room-object drawer" data-object="drawer">
        <span>▤</span>
        <span class="object-label">抽屜</span>
      </button>

      <button class="room-object bookshelf" data-object="bookshelf">
        <span>▥</span>
        <span class="object-label">書櫃</span>
      </button>

      <button class="room-object cabinet" data-object="cabinet">
        <span>▣</span>
        <span class="object-label">隱藏櫃</span>
      </button>

      <button class="room-object door" data-object="door">
        <span class="door-handle"></span>
        <span class="object-label">房門</span>
      </button>

      <div class="floor"></div>
    </section>

    <aside class="sidebar">
      <div class="side-card">
        <h3>🎒 我的道具</h3>
        <div id="inventory">
          <p class="muted">目前沒有道具。</p>
        </div>
      </div>

      <div class="side-card">
        <h3>📋 調查紀錄</h3>
        <div id="logs">
          <p class="muted">開始探索吧。</p>
        </div>
      </div>

      <div class="side-card">
        <h3>💡 提示</h3>
        <p id="hintText">
          先看看書櫃，也許有什麼被遺忘的東西。
        </p>
      </div>
    </aside>

  </div>

</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="closeModal" class="close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<footer>
  MEMORY ROOM 000 · 每一段記憶，都有被留下的理由。
</footer>

<script src="script.js"></script>
</body>
</html>
