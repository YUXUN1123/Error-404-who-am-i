<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERROR 404：這台電腦不記得自己是誰</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 開機畫面 -->
  <div id="boot-screen">
    <div class="boot-text">點擊開始</div>
  </div>

  <!-- 桌面 -->
  <div id="desktop" class="hidden">
    <div id="icons">
      <div class="icon" data-window="mycomputer">🖥️<span>我的電腦</span></div>
      <div class="icon" data-window="memory">🔒<span>我的記憶</span></div>
      <div class="icon" data-window="recycle">🗑️<span>回收桶</span></div>
      <div class="icon" data-window="browser">🌐<span>瀏覽器</span></div>
      <div class="icon" data-window="notes">📝<span>便利貼</span></div>
      <div class="icon" data-window="terminal">⌨️<span>終端機</span></div>
      <div class="icon" data-window="auth">🔑<span>身份驗證</span></div>
      <div class="icon" data-window="errorreport">⚠️<span>錯誤報告</span></div>
    </div>

    <!-- 完整度條 -->
    <div id="completeness">
      <span>記憶完整度</span>
      <div class="bar"><div id="completeness-fill"></div></div>
      <span id="completeness-text">12%</span>
    </div>

    <!-- 工作列 -->
    <div id="taskbar">
      <button id="help-btn">求助</button>
      <span id="clock">--:--</span>
    </div>
  </div>

  <!-- 通用視窗模板 -->
  <div id="window-layer"></div>

  <!-- 提示紀錄 -->
  <div id="hint-log" class="hidden"></div>

  <!-- 結局畫面 -->
  <div id="ending-screen" class="hidden">
    <div id="ending-text"></div>
    <div id="ending-record"></div>
    <button id="restart-btn">重新開始</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
