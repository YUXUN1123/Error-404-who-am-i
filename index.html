<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERROR 404：這台電腦不記得自己是誰</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" data-act="0">

  <!-- 序幕 -->
  <section id="prologue" class="scene">
    <div class="pro-wrap">
      <p class="note">本遊戲帶有輕微的驚悚氣氛，以及失落與遺忘的情緒主題。<br>右上角的「設定」可隨時開啟「降低驚悚效果」。</p>
      <div id="proLines"></div>
      <button id="enterRoom" class="btn big">進入房間</button>
      <p class="skiphint">點一下畫面可略過</p>
    </div>
  </section>

  <!-- 房間 -->
  <section id="room" class="scene hidden" aria-label="房間">
    <div id="stage"><div id="wall"></div><div id="desk"></div></div>
    <div id="narr" role="status" aria-live="polite"></div>
  </section>

  <!-- 電腦桌面 -->
  <section id="desktop" class="scene hidden" aria-label="電腦桌面">
    <div id="icons"></div>
    <div id="wins"></div>
    <div id="popups"></div>
    <div id="taskbar">
      <button class="btn" id="backRoom">回房間</button>
      <button class="btn" id="taskBtn">任務</button>
      <span class="sp"></span>
      <div id="pctWrap"><span>記憶完整度 <b id="pctNum">12</b>%</span><div id="pctBar"><i></i></div></div>
      <button id="cam" aria-label="鏡頭指示燈"></button>
      <span id="clock">--:--</span>
    </div>
  </section>

  <div id="echo"><div id="echoName">▇▇▇▇</div><div id="echoText"></div></div>

  <aside id="task" class="hidden min">
    <div class="th" id="taskHead"><p class="t-now" id="tNow"></p><span id="tArrow">▾</span></div>
    <div class="tb">
      <p class="t-why" id="tWhy"></p>
      <p class="t-where" id="tWhere"></p>
      <p class="t-hint" id="tHint"></p>
      <button class="btn" id="hintBtn">我卡住了（提示）</button>
      <div class="bar"><i id="tBar"></i></div>
    </div>
  </aside>

  <div id="toasts"></div>
  <div id="modal" class="hidden"></div>
  <div id="flash"></div>
  <div id="ghost" class="hidden"></div>
  <div id="replay" class="hidden"><div id="replayBox"></div><button id="replaySkip" class="btn">跳過</button></div>
  <div id="ending" class="hidden"></div>

  <div id="music"><span id="mname">♪ 點一下開始</span><button id="mbtn" aria-pressed="false">靜音</button></div>
  <div id="gear">
    <button id="gearBtn">設定</button>
    <div id="gearPanel">
      <label><input type="checkbox" id="lowFear"> 降低驚悚效果</label>
      <p class="small">關閉畫面閃爍、黑屏、幽靈游標與時間閃現。</p>
      <button class="btn" id="restart">重新開始</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
