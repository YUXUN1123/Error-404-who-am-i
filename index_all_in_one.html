<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERROR 404：這台電腦不記得自己是誰</title>
<style>
/* ERROR 404：這台電腦不記得自己是誰 —— 樣式 */
:root{
  --bg:#05070b; --ink:#dbe5ec; --dim:#7f8d99; --line:#1d2a36; --panel:#0b1118; --panel2:#101a24;
  --accent:#5de0d0; --red:#ff4d5e; --warm:#ffd27a; --wall:#0c141d; --wood:#2b1f18; --wood2:#3a2a20;
  --eb:44px; /* 桌面工作列高度 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
.scene{position:absolute;inset:0}
.btn{background:var(--panel2);border:1px solid #2b3d4d;border-radius:8px;padding:8px 14px;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible,.obj:focus-visible,.icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.big{padding:12px 24px;font-size:1.05rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.small{font-size:.82rem;color:var(--dim)}

/* ===== 序幕 ===== */
#prologue{background:radial-gradient(ellipse at 50% 40%,#0d1620 0,#04060a 70%);display:flex;align-items:center;justify-content:center;text-align:center;z-index:5}
.pro-wrap{max-width:560px;padding:24px}
.pro-wrap .note{color:var(--dim);font-size:.85rem;line-height:1.7;margin-bottom:40px}
#proLines p{font-size:1.35rem;line-height:1.9;margin:.2em 0;opacity:0;transition:opacity 1.2s}
#proLines p.on{opacity:1}
#enterRoom{margin-top:34px;opacity:0;pointer-events:none;transition:opacity 1s}
#enterRoom.on{opacity:1;pointer-events:auto}
.skiphint{margin-top:18px;color:#3d4b57;font-size:.78rem}

/* ===== 房間 ===== */
#room{background:#03050a;display:flex;align-items:center;justify-content:center;z-index:2;transition:opacity .4s}
#stage{position:relative;width:min(100vw,calc((100vh - 90px)*1.6));aspect-ratio:16/10;background:var(--wall);overflow:hidden;
  box-shadow:0 0 80px #000 inset,0 0 0 1px #14202b}
#wall{position:absolute;inset:0;bottom:42%;background:linear-gradient(#0a1119,#0e1823)}
#desk{position:absolute;left:0;right:0;top:58%;bottom:0;background:linear-gradient(#3a2a20 0,#2b1f18 8%,#241a14 100%);border-top:3px solid #4a372a}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 30%,rgba(0,0,0,.72) 100%);transition:background .5s}
#room.dark #stage::after{background:radial-gradient(ellipse at 50% 48%,transparent 8%,rgba(0,0,0,.93) 70%)}
.obj{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);background:none;border:0;padding:0;z-index:3;
  filter:brightness(.78);transition:filter .2s,transform .2s}
.obj svg{width:100%;height:100%;display:block;overflow:visible}
.obj:hover,.obj:focus-visible{filter:brightness(1.35)}
.obj .lab{position:absolute;left:50%;bottom:-1.6em;transform:translateX(-50%);font-size:.72rem;color:#c6d4de;background:rgba(0,0,0,.7);padding:1px 7px;border-radius:99px;opacity:0;white-space:nowrap;pointer-events:none;transition:.15s;z-index:9}
.obj:hover .lab,.obj:focus-visible .lab{opacity:1}
.obj.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{filter:brightness(.9) drop-shadow(0 0 0 transparent)}50%{filter:brightness(1.5) drop-shadow(0 0 8px var(--accent))}}
.o-computer{z-index:4}
.o-computer .scr{fill:#0e2a30;animation:scrflick 4s infinite}
@keyframes scrflick{0%,100%{fill:#0e2a30}50%{fill:#12363d}93%{fill:#0e2a30}95%{fill:#1c4f58}96%{fill:#0e2a30}}
.led{fill:var(--red);animation:blink 1.6s infinite}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}
.o-window{z-index:2;filter:none}
.o-window:hover,.o-window:focus-visible{filter:brightness(1.2)}
.winpane{position:absolute;inset:0;border:5px solid #1b2a38;background:#06090e;overflow:hidden}
.winpane::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:#1b2a38}
.winpane canvas{width:100%;height:100%;display:block}
.winpane .figure{position:absolute;left:58%;top:42%;width:18%;height:56%;background:#000;border-radius:40% 40% 0 0;opacity:0;transition:opacity 2s;filter:blur(1px)}
#room[data-act="3"] .figure,#room[data-act="4"] .figure,#room[data-act="5"] .figure{opacity:.45}
.o-door{z-index:2}
.o-calendar{z-index:2}
.o-frame svg{transform:rotate(-8deg)}
.hand{transform-origin:50px 52px}
#room[data-act="2"] .tick,#room[data-act="3"] .tick,#room[data-act="4"] .tick{animation:tick 7s infinite}
@keyframes tick{0%,90%{transform:rotate(0)}93%{transform:rotate(6deg)}97%,100%{transform:rotate(0)}}

/* 結局後的房間 */
#room.end-A .o-computer,#room.end-A .o-mug,#room.end-A .o-lamp{opacity:0;pointer-events:none}
#room.end-B .o-mug::before{content:"";position:absolute;left:30%;top:-30%;width:40%;height:40%;border-radius:50%;background:radial-gradient(rgba(255,255,255,.35),transparent 70%);animation:steam 3s infinite}
@keyframes steam{0%{transform:translateY(0);opacity:.7}100%{transform:translateY(-60%);opacity:0}}
#room.end-C #wall{background:linear-gradient(#1b2a3a,#3a3a44)}
#room.end-C .o-door{filter:brightness(1.4) drop-shadow(0 0 14px #ffe9b0)}

#narr{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(640px,92vw);min-height:46px;padding:10px 16px;
  background:rgba(8,13,19,.86);border:1px solid #1e2f3d;border-radius:10px;color:#c9d6df;text-align:center;line-height:1.6;z-index:8}

/* ===== 桌面 ===== */
#desktop{background:radial-gradient(ellipse at 60% 30%,#0f2330 0,#070d14 70%);z-index:3;transition:opacity .4s}
#icons{position:absolute;left:10px;top:10px;bottom:calc(var(--eb) + 50px);display:flex;flex-direction:column;flex-wrap:wrap;gap:8px;align-content:flex-start;width:200px;z-index:2}
.icon{width:82px;background:none;border:1px solid transparent;border-radius:8px;padding:6px 2px;text-align:center;position:relative;font-size:.78rem;line-height:1.25;color:#cdd9e2}
.icon:hover{background:rgba(93,224,208,.08);border-color:#1f3a45}
.icon .g{font-size:1.9rem;display:block}
.icon .nw{position:absolute;right:4px;top:0;background:var(--red);color:#fff;font-size:.62rem;font-weight:700;border-radius:6px;padding:0 5px;animation:pulse 1.4s infinite}
.icon.glow .g{animation:glow 2.2s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
#wins{position:absolute;inset:0 0 var(--eb) 0;z-index:3;pointer-events:none}
.win{position:absolute;pointer-events:auto;max-width:96vw;max-height:calc(100% - 20px);background:var(--panel);border:1px solid #2a3b4a;border-radius:10px;
  box-shadow:0 14px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
.wtitle{display:flex;justify-content:space-between;align-items:center;padding:7px 10px 7px 14px;background:#122030;cursor:move;font-size:.88rem;user-select:none;touch-action:none}
.wclose{background:none;border:0;color:var(--dim);font-size:1rem;padding:2px 8px;border-radius:6px}
.wclose:hover{background:#3a1d24;color:#fff}
.wbody{padding:14px 16px;overflow:auto;line-height:1.7;font-size:.94rem}
.wbody p{margin:.4em 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:.6em 0}
select,input[type=text]{background:#0a141d;border:1px solid #2b3d4d;color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit}
.re{min-height:3em;color:#f0c987}
.ok{color:var(--accent)}
.err{color:var(--red)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv b{color:var(--dim);font-weight:400}
.redact{background:#2a3642;color:transparent;border-radius:3px;user-select:none}
.slots{display:flex;gap:10px;margin:10px 0}
.slot{width:54px;height:62px;border:1px dashed #36505f;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.7rem;font-weight:700;color:#2d4655}
.slot small{font-size:.62rem;font-weight:400;color:#516878}
.slot.got{border:1px solid var(--accent);color:var(--accent);background:rgba(93,224,208,.07)}
.flist{display:flex;flex-direction:column;gap:6px}
.file{display:flex;gap:10px;align-items:center;text-align:left;background:#0d1822;border:1px solid #20323f;border-radius:8px;padding:9px 12px}
.file:hover{border-color:var(--accent)}
.file .done{margin-left:auto;color:var(--accent);font-size:.8rem}

/* ECHO 對話框 */
#echo{position:absolute;left:50%;bottom:calc(var(--eb) + 16px);transform:translateX(-50%);width:min(640px,94vw);z-index:45;
  background:rgba(7,13,19,.94);border:1px solid #28485a;border-radius:12px;padding:10px 16px 12px;display:none;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#echo.on{display:block}
#echo.room{bottom:84px}
#echoName{font-size:.72rem;letter-spacing:.12em;color:var(--accent);margin-bottom:2px}
#echoText{line-height:1.7;min-height:1.7em}
#echo.cold #echoName{color:#8aa}
#echo.glitch #echoText{animation:jit .3s steps(3) 2}
@keyframes jit{50%{transform:translateX(2px);color:var(--red)}}

/* 工作列 */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:var(--eb);background:#0a121a;border-top:1px solid #1e2f3d;display:flex;align-items:center;gap:10px;padding:0 10px;z-index:50}
#taskbar .sp{flex:1}
#pctWrap{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--dim)}
#pctBar{width:90px;height:6px;border-radius:9px;background:#16222d;overflow:hidden}
#pctBar i{display:block;height:100%;background:var(--accent);transition:width .8s}
#clock{font-variant-numeric:tabular-nums;font-size:.9rem;min-width:46px;text-align:right}
#clock.glitch{color:var(--red)}
#cam{width:12px;height:12px;border-radius:50%;background:var(--red);border:0;padding:0;animation:blink 1.6s infinite}
#popups{position:absolute;right:14px;bottom:calc(var(--eb) + 150px);display:flex;flex-direction:column;gap:8px;z-index:44;width:min(320px,90vw)}
.popup{background:#1a0f13;border:1px solid #6b2a34;border-radius:10px;padding:12px 14px;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:rise .3s}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.popup h4{margin:0 0 4px;color:#ff8d98}

/* 任務面板 */
#task{position:fixed;right:10px;top:48px;width:min(300px,calc(100vw - 20px));z-index:40;background:rgba(8,14,20,.92);border:1px solid #213442;border-radius:12px;padding:10px 12px;font-size:.86rem;line-height:1.6}
#task .th{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
#task .t-now{font-weight:700;margin:0;color:#e6f6f3}
#task .tb{margin-top:6px}
#task.min .tb{display:none}
#task p{margin:.3em 0}
#task .t-why,#task .t-where{color:var(--dim)}
#task .t-hint{color:#f0c987}
#hintBtn.pulse{border-color:var(--warm);color:var(--warm);animation:pulse 1.4s infinite}
.bar{height:6px;background:#16222d;border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .8s}

#toasts{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:85;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(12,20,28,.95);border:1px solid #2a4658;border-radius:99px;padding:6px 16px;font-size:.85rem;animation:rise .3s}

/* 音樂鈕與設定 */
#music{position:fixed;left:10px;bottom:10px;z-index:70;display:flex;align-items:center;gap:8px;background:rgba(8,14,20,.88);border:1px solid #213442;border-radius:99px;padding:4px 6px 4px 12px;font-size:.78rem;color:var(--dim)}
#music.d{bottom:calc(var(--eb) + 8px)}
#music button{border:1px solid #2b3d4d;background:#101a24;border-radius:99px;padding:3px 10px;font-size:.78rem}
#gear{position:fixed;right:10px;top:8px;z-index:75}
#gear>button{background:rgba(8,14,20,.88);border:1px solid #213442;border-radius:99px;padding:4px 12px;font-size:.8rem}
#gearPanel{position:absolute;right:0;top:34px;width:230px;background:#0b1118;border:1px solid #2a3b4a;border-radius:10px;padding:10px 12px;font-size:.84rem;display:none}
#gearPanel.on{display:block}
#gearPanel label{display:flex;gap:8px;align-items:center;margin:6px 0}

/* 終端機 */
.term{background:#030608;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86rem;color:#b9f5e8;height:340px;overflow:auto;padding:10px;border-radius:6px}
.term div{white-space:pre-wrap;word-break:break-word;line-height:1.5}
.term .g{color:#ff6b79}
.term .d{color:#6d8793}
.tin{display:flex;gap:6px;align-items:center;margin-top:6px;font-family:ui-monospace,Menlo,Consolas,monospace}
.tin input{flex:1;background:#030608;border:1px solid #1d3a3f;color:#b9f5e8}

/* 彈窗 modal */
#modal{position:fixed;inset:0;z-index:60;background:rgba(2,4,8,.78);display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{background:var(--panel);border:1px solid #2a3b4a;border-radius:14px;width:min(560px,100%);max-height:94vh;overflow:auto;padding:18px 20px;line-height:1.7;box-shadow:0 20px 60px #000}
.mbox h3{margin:.1em 0 .4em}
.mbox .x{float:right;background:none;border:0;color:var(--dim);font-size:1.1rem}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.choices .btn{text-align:left;padding:12px 14px}
.choices .btn small{display:block;color:var(--dim)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#flash{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;background:#ff1f3a}
#flash.go{animation:fl .35s}
@keyframes fl{0%{opacity:.28}100%{opacity:0}}
#flash.black{background:#000;animation:blk 1.1s}
@keyframes blk{0%,70%{opacity:1}100%{opacity:0}}
#ghost{position:fixed;z-index:46;width:18px;height:18px;pointer-events:none;opacity:.5;left:20vw;top:70vh;transition:left 1.6s ease-in-out,top 1.6s ease-in-out,opacity .6s}
#ghost::before{content:"";position:absolute;inset:0;background:#fff;clip-path:polygon(0 0,0 100%,30% 75%,50% 100%,65% 92%,45% 68%,85% 68%)}
.low #ghost{display:none}

/* 小遊戲 */
.cal{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:min(360px,100%);margin:10px auto}
.tile{aspect-ratio:3/2;border:2px solid #2b3d4d;border-radius:4px;background-size:300% 200%;background-repeat:no-repeat;padding:0}
.tile.sel{border-color:var(--accent);box-shadow:0 0 10px var(--accent)}
.cv{display:block;margin:10px auto;border:1px solid #2b3d4d;border-radius:8px;touch-action:none;max-width:100%}
.radio{background:#14100c;border:1px solid #3a2c20;border-radius:10px;padding:14px;margin:10px 0}
.noise{font-family:monospace;font-size:1.6rem;letter-spacing:.3em;text-align:center;min-height:2.2em;color:#a7916f}
.noise.lock{color:var(--warm);text-shadow:0 0 12px var(--warm)}
input[type=range]{width:100%}
.screen{background:#030608;border:1px solid #1d3a3f;border-radius:8px;padding:14px;min-height:190px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#b9f5e8;line-height:1.8}
.screen .bigc{font-size:3.4rem;color:var(--red);text-align:center;text-shadow:0 0 20px var(--red)}
.low .screen .bigc{text-shadow:none}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;animation:rise .3s}
.msg.u{align-self:flex-end;background:#16384a}
.msg.e{align-self:flex-start;background:#1a2330}
.msg small{display:block;color:var(--dim);font-size:.68rem}
.wave{display:flex;gap:3px;align-items:center;height:48px;margin:10px 0}
.wave i{flex:1;background:var(--accent);border-radius:3px;height:12%;opacity:.7}
.wave.on i{animation:wv .9s infinite ease-in-out}
@keyframes wv{50%{height:90%}}
.cap{min-height:3.4em;color:#f0e3c4}
.paper{background:#d9d2c0;color:#2b2620;border-radius:4px;padding:16px 18px;font-family:"Kaiti TC","KaiTi",serif;font-size:1.05rem;transform:rotate(-1.2deg);line-height:2}
.paper s{color:#7a736a}
.photo{border:8px solid #e6e0d0;border-radius:2px;background:#10161c;max-width:100%}
.sealwrap{display:flex;gap:14px;align-items:center;justify-content:space-between;margin:14px 0;min-height:110px}
.memcard{position:relative;background:#16384a;border:1px solid var(--accent);border-radius:10px;padding:14px 12px;text-align:center;touch-action:none;cursor:grab;user-select:none;width:120px}
.sealbox{width:150px;height:100px;border:2px dashed #4a6575;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--dim);transition:.2s}
.sealbox.in{border-color:var(--accent);color:var(--accent);background:rgba(93,224,208,.08)}
#holdBtn{position:relative;overflow:hidden;width:100%}
#holdBtn i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(93,224,208,.35)}
#holdBtn span{position:relative}

/* 重播與結局 */
#replay{position:fixed;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center;padding:20px}
#replayBox{width:min(680px,100%);font-family:ui-monospace,Menlo,Consolas,monospace;color:#d6e4ea;line-height:1.9;font-size:.98rem}
#replayBox div{min-height:1.9em}
#replayBox .r{color:var(--red)}
#replayBox .y{color:var(--warm)}
#replaySkip{position:absolute;right:16px;bottom:16px}
#ending{position:fixed;inset:0;z-index:82;background:#020407;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#ending .box{max-width:560px;text-align:center;line-height:2}
#ending h2{letter-spacing:.2em;font-weight:500}
#ending .ln{opacity:0;transition:opacity 1s}
#ending .ln.on{opacity:1}
#ending .stats{margin:18px 0;color:var(--dim);font-size:.85rem;line-height:1.8}
#ending.C{background:linear-gradient(#0a1420,#2a2a30)}
#ending.B{background:linear-gradient(#050a10,#1a1510)}

@media (max-width:720px){
  #icons{width:180px}
  .win{left:0!important;top:0!important;width:100%!important;height:100%!important;max-height:none;border-radius:0}
  #task{top:44px}
  #echo{bottom:calc(var(--eb) + 8px)}
  #pctBar{width:50px}
}
@media (orientation:portrait){
  #stage{width:100vw;aspect-ratio:3/4}
  #narr{bottom:54px}
  #echo.room{bottom:124px}
  .obj{left:var(--px,var(--x));top:var(--py,var(--y));width:var(--pw,var(--w));height:var(--ph,var(--h))}
  #desk{top:54%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
.low *,.low *::before,.low *::after{animation-iteration-count:1!important}
.low .led,.low #cam{animation:none}
</style>
</head>
<body>
<div id="app" data-act="0">

  <!-- 序幕 -->
  <section id="prologue" class="scene">
    <div class="pro-wrap">
      <p class="note">本遊戲帶有輕微的驚悚氣氛，以及失落與遺忘的情緒主題。<br>右上角的「設定」可隨時開啟「降低驚悚效果」。</p>
      <div id="proLines"></div>
      <button id="enterRoom" class="btn big">進入房間</button>
      <p class="skiphint">點一下畫面可略過</p>
    </div>
  </section>

  <!-- 房間 -->
  <section id="room" class="scene hidden" aria-label="房間">
    <div id="stage"><div id="wall"></div><div id="desk"></div></div>
    <div id="narr" role="status" aria-live="polite"></div>
  </section>

  <!-- 電腦桌面 -->
  <section id="desktop" class="scene hidden" aria-label="電腦桌面">
    <div id="icons"></div>
    <div id="wins"></div>
    <div id="popups"></div>
    <div id="taskbar">
      <button class="btn" id="backRoom">回房間</button>
      <button class="btn" id="taskBtn">任務</button>
      <span class="sp"></span>

/* ECHO 對話佇列（打字機；點一下可略過） */
const Echo = {
  q: [], busy: false, tok: 0, timer: null, iv: null, cur: '',
  pick(entry) {
    if (!entry) return [];
    if (Array.isArray(entry)) return entry;
    if (state.attitude === 'cold' && entry.cold && state.act >= 4) return entry.cold;
    return entry['a' + state.act] || entry['a' + Math.min(5, Math.max(1, state.act))] || [];
  },
  say(entry) { const lines = this.pick(entry); this.push(lines); },
  push(items) { [].concat(items).forEach(x => this.q.push(x)); if (!this.busy) this.next(); },
  then(fn) { this.q.push(fn); if (!this.busy) this.next(); },
  clear() { this.q = []; this.busy = false; this.tok++; clearTimeout(this.timer); clearInterval(this.iv); $('#echo').classList.remove('on'); },
  next() {
    const it = this.q.shift();
    if (it === undefined) { this.busy = false; clearTimeout(this.timer); const my = this.tok; this.timer = setTimeout(() => { if (!this.busy && my === this.tok) $('#echo').classList.remove('on'); }, 3500); return; }
    if (typeof it === 'function') { it(); return this.next(); }
    this.busy = true; clearTimeout(this.timer);
    const box = $('#echo'), tx = $('#echoText'); box.classList.add('on');
    box.classList.toggle('room', roomVisible()); box.classList.toggle('cold', state.attitude === 'cold');
    $('#echoName').textContent = echoName();
    this.cur = it; const my = ++this.tok; tx.textContent = '';
    if (!state.lowFear && state.act === 1 && Math.random() < .2) { box.classList.remove('glitch'); void box.offsetWidth; box.classList.add('glitch'); }
    const wait = () => { this.timer = setTimeout(() => { if (my === this.tok) this.next(); }, window.__fast ? 5 : 900 + it.length * 35); };
    if (reduce || window.__fast) { tx.textContent = it; wait(); return; }
    let i = 0; this.iv = setInterval(() => { if (my !== this.tok) return clearInterval(this.iv); i++; tx.textContent = it.slice(0, i); if (i >= it.length) { clearInterval(this.iv); wait(); } }, 26);
  },
  skip() {
    if (!this.busy) return;
    clearInterval(this.iv); clearTimeout(this.timer); this.tok++;
    $('#echoText').textContent = this.cur; const my = this.tok;
    this.timer = setTimeout(() => { if (my === this.tok) this.next(); }, 450);
  }
};

function roomGlow(id) {
  const a = state.act;
  if (id === 'computer') return a === 0 && state.idleGlow;
  if (id === 'sticky') return a === 2 && !state.letters.E;
  if (id === 'radio') return a === 2 && !state.letters.H;
  if (id === 'window') return a === 2 && !state.letters.O;
  if (id === 'frame') return a >= 4 && !state.frameOpen;
  return false;
}
function renderRoom() {
  const r = $('#room'); r.dataset.act = state.act;
  r.classList.toggle('dark', state.lampOff);
  $$('.obj', r).forEach(b => b.classList.toggle('glow', roomGlow(b.dataset.id)));
}
function windowLine() {
  const h = new Date().getHours(), W = GD.roomText.window;
  if (state.act >= 3 && Math.random() < .6) return W.figure;
  return (h >= 6 && h < 18 ? W.day + ' ' : '') + W[season()];

function onObj(id) {
  state.touched.add(id);
  const T = GD.roomText, a = state.act, end = state.ended, R = GD.endRoom[end || 'A'];
  if (end && R[id]) { narrate(R[id]); return; }
  switch (id) {
    case 'computer': if (end) { narrate(R.computer); return; } enterDesktop(); return;
    case 'lamp': state.lampOff = !state.lampOff; renderRoom(); narrate(state.lampOff ? T.lampOn : T.lampOff); return;
    case 'clock': narrate(a >= 2 && !end ? '秒針抖了一下，又停回 03:14。' : T.clock[0]); return;

      if (a >= 2 && !state.letters.H) openRadio(); else narrate(a >= 2 ? T.radioDone : T.radio1); return;
    case 'window':
      if (a >= 2 && !state.letters.O) openWipe(); else narrate(windowLine()); return;

/* 房間：天氣畫布（依玩家電腦的季節與日夜） */
let weatherOn = false;
function weatherStart() {
  const cv = $('#wcv'); if (!cv || weatherOn) return;
  weatherOn = true;
  const c = cv.getContext('2d'), W = cv.width, H = cv.height, s = season(), h = new Date().getHours(), day = h >= 6 && h < 18;
  const N = { spring: 50, summer: 14, autumn: 16, winter: 44 }[s], P = [];
  for (let i = 0; i < N; i++) P.push({ x: Math.random() * W, y: Math.random() * H, v: 0.6 + Math.random() * 1.6, p: Math.random() * 6 });
  function draw() {
    const g = c.createLinearGradient(0, 0, 0, H);
    if (day) { g.addColorStop(0, '#5b7a92'); g.addColorStop(1, '#8aa2b0'); } else { g.addColorStop(0, '#05080e'); g.addColorStop(1, '#0d1824'); }
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    if (s === 'winter') { c.fillStyle = 'rgba(210,225,235,.14)'; c.fillRect(0, 0, W, H); }
    P.forEach(p => {
      p.p += 0.04;
      if (s === 'spring') { p.y += p.v * 5; p.x -= 0.6; c.strokeStyle = 'rgba(170,200,230,.55)'; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x + 2, p.y + 9); c.stroke(); }
      else if (s === 'summer') { p.x += Math.sin(p.p) * 0.6; p.y += Math.cos(p.p * 0.7) * 0.4; c.fillStyle = `rgba(230,240,120,${0.35 + 0.35 * Math.sin(p.p * 2)})`; c.beginPath(); c.arc(p.x, p.y, 2.4, 0, 7); c.fill(); }
      else if (s === 'autumn') { p.y += p.v * 0.9; p.x += Math.sin(p.p) * 1.4 + 0.8; c.fillStyle = 'rgba(190,110,50,.8)'; c.fillRect(p.x, p.y, 5, 3); }
      else { p.y += p.v * 0.6; p.x += Math.sin(p.p) * 0.5; c.fillStyle = 'rgba(240,248,255,.85)'; c.beginPath(); c.arc(p.x, p.y, 1.8, 0, 7); c.fill(); }
      if (p.y > H) { p.y = -8; p.x = Math.random() * W; } if (p.x > W) p.x = 0; if (p.x < 0) p.x = W;
    });
    if (roomVisible() && !reduce) requestAnimationFrame(draw); else weatherOn = false;
  }
  draw();
}

/* 房間小遊戲 1：日曆拼圖（點兩片交換） */
function calURI() {
  let g = '';
  const names = ['日', '一', '二', '三', '四', '五', '六'];
  names.forEach((n, i) => g += `<text x="${36 + i * 48}" y="68" font-size="14" fill="#7a7466" text-anchor="middle">${n}</text>`);
  for (let d = 1; d <= 31; d++) { const idx = d - 1 + 3, col = idx % 7, row = Math.floor(idx / 7); g += `<text x="${36 + col * 48}" y="${100 + row * 32}" font-size="18" fill="#3a352c" text-anchor="middle">${d}</text>`; }
  const idx = 16, col = idx % 7, row = Math.floor(idx / 7), cx = 36 + col * 48, cy = 94 + row * 32;
  g += `<circle cx="${cx}" cy="${cy}" r="19" fill="none" stroke="#b02323" stroke-width="3"/>`;
  g += `<path d="M${cx - 18} ${cy - 10} L${cx + 18} ${cy + 8} M${cx - 18} ${cy + 8} L${cx + 18} ${cy - 10} M${cx - 20} ${cy} H${cx + 20}" stroke="#1a1a1a" stroke-width="4"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240"><rect width="360" height="240" fill="#e8e2d0"/><rect width="360" height="44" fill="#a23a3a"/><text x="180" y="30" font-size="22" fill="#fff" text-anchor="middle">三月  MARCH</text>${g}</svg>`;
  return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
}
function openCalendar() {
  const box = openModal('<h3>被撕碎的日曆</h3><p class="small">日曆被撕成六片。點兩片，可以交換位置。</p><div class="cal" id="cal"></div><p id="calmsg" class="re"></p>');
  let order = [0, 1, 2, 3, 4, 5];
  do { order.sort(() => Math.random() - .5); } while (order.every((v, i) => v === i));
  let sel = null; const uri = calURI(), cal = $('#cal', box);
  const draw = () => {
    cal.innerHTML = '';
    order.forEach((t, i) => {
      const b = el('button', 'tile' + (sel === i ? ' sel' : '')); b.dataset.pos = i; b.dataset.tile = t; b.setAttribute('aria-label', '碎片 ' + (i + 1));
      b.style.backgroundImage = uri; b.style.backgroundPosition = `${(t % 3) * 50}% ${Math.floor(t / 3) * 100}%`;
      b.onclick = () => {
        if (sel === null) sel = i; else { [order[sel], order[i]] = [order[i], order[sel]]; sel = null; }
        draw();
        if (order.every((v, k) => v === k)) { done(); }
      };
      cal.appendChild(b);
    });
  };
  const done = () => {
    $$('.tile', cal).forEach(b => b.disabled = true);
    $('#calmsg', box).textContent = '拼好了。三月 14 日被圈了起來，又被塗掉。';
    state.calendarDone = true; progress(); Music.sfx('ok'); toast('取得線索：被塗掉的日期');
    narrate(GD.roomText.calDone);
    if (state.act >= 1) Echo.push(['那個被塗掉的日期……我好像認得。']);
  };
  draw();
}

    if (finished) return;

/* ---------- 7 桌面與視窗 ---------- */
const WINS = {}; let zTop = 10, cascadeN = 0;
const REG = {};
function openWin(id) {
  const def = REG[id]; if (!def) return;
  state.newIcons.delete(id); renderIcons();
  if (WINS[id]) { focusWin(id); if (def.dyn) def.render($('.wbody', WINS[id])); return; }
  if (def.parent) Object.keys(WINS).forEach(k => { if (REG[k].parent === def.parent) closeWin(k); });   /* 同一個資料夾一次只開一個檔案 */
  const keys = Object.keys(WINS); if (keys.length >= 5) closeWin(keys[0]);
  const w = el('div', 'win'); w.dataset.id = id; w.style.width = (def.w || 460) + 'px';
  w.innerHTML = `<div class="wtitle"><span></span><button class="wclose" aria-label="關閉">✕</button></div><div class="wbody"></div>`;
  $('span', w).textContent = def.title;
  $('#wins').appendChild(w); WINS[id] = w;
  const off = (cascadeN++ % 5) * 26; w.style.left = (210 + off) + 'px'; w.style.top = (24 + off) + 'px';
  if (def.parent && WINS[def.parent]) {   /* 檔案視窗放在資料夾視窗的右邊，不蓋住清單 */
    const pr = WINS[def.parent], right = pr.offsetLeft + pr.offsetWidth + 12;
    if (right + (def.w || 460) < innerWidth) { w.style.left = right + 'px'; w.style.top = pr.offsetTop + 'px'; }
  }
  $('.wclose', w).onclick = () => closeWin(id);
  w.addEventListener('pointerdown', () => focusWin(id));
  const bar = $('.wtitle', w);
  bar.addEventListener('pointerdown', e => {
    if (innerWidth <= 720 || e.target.closest('.wclose')) return;
    const r = w.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top; bar.setPointerCapture(e.pointerId);
    const mv = ev => { w.style.left = Math.max(0, Math.min(innerWidth - 80, ev.clientX - dx)) + 'px'; w.style.top = Math.max(0, Math.min(innerHeight - 100, ev.clientY - dy)) + 'px'; };
    const up = () => { bar.removeEventListener('pointermove', mv); bar.removeEventListener('pointerup', up); };
    bar.addEventListener('pointermove', mv); bar.addEventListener('pointerup', up);
  });
  def.render($('.wbody', w), w); focusWin(id); if (def.onOpen) def.onOpen(w);
}
function focusWin(id) { if (WINS[id]) WINS[id].style.zIndex = ++zTop; }
function closeWin(id) { const w = WINS[id]; if (!w) return; if (REG[id] && REG[id].onClose) REG[id].onClose(); w.remove(); delete WINS[id]; }
function closeAllWins() { Object.keys(WINS).forEach(closeWin); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#modal').classList.contains('hidden') && $('#modal .x')) { closeModal(); return; }
    const ids = Object.keys(WINS);
    if (ids.length) { const top = ids.sort((a, b) => WINS[a].style.zIndex - WINS[b].style.zIndex).pop(); closeWin(top); }
  }
});

    solve2();
  } else {
    state.wrong[2]++; re.textContent = '驗證失敗：不是這個名字。'; wrongFx($('.win[data-id=ident]'));
    Echo.push(GD.echo.wrongName.a2[(state.wrong[2] - 1) % 3]); checkNudge();
  }
}
function getLetter(L) {
  if (state.letters[L]) return; state.letters[L] = true; progress(); Music.sfx('new'); toast('取得名字碎片：' + L);
  Echo.say(GD.echo['letter' + L]);
  if (Object.values(state.letters).every(Boolean)) { Echo.say(GD.echo.all); state.newIcons.add('ident'); }
  refreshAll();
}

/* ---------- 9 劇情流程 ---------- */
function setAct(n) { state.act = n; progress(); $('#tHint').textContent = ''; $('#hintBtn').classList.remove('pulse'); refreshAll(); }
function refreshAll() {
  $('#app').dataset.act = state.act;
  renderIcons(); renderTask(); renderRoom();
  $('#pctNum').textContent = pct(); $('#pctBar i').style.width = pct() + '%'; $('#tBar').style.width = pct() + '%';
  Object.keys(WINS).forEach(id => { if (REG[id].dyn) REG[id].render($('.wbody', WINS[id])); });
  $('#echoName').textContent = echoName();
}
function renderTask() {
  const t = GD.tasks[state.act], p = $('#task');
  if (!t) { p.classList.add('hidden'); return; }
  p.classList.remove('hidden');
  $('#tNow').textContent = t.now; $('#tWhy').textContent = t.why; $('#tWhere').textContent = t.where;
  $('#hintBtn').style.display = state.act >= 1 && state.act <= 3 ? '' : 'none';
}
function showHint() {
  const a = state.act; if (a < 1 || a > 3) return;
  const lv = Math.min(state.hintLv[a], 2), txt = GD.hints[a][lv]; state.hintLv[a] = Math.min(state.hintLv[a] + 1, 3);
  $('#tHint').textContent = '提示：' + txt; $('#hintBtn').classList.remove('pulse'); $('#task').classList.remove('min'); $('#tArrow').textContent = '▴';
}
function checkNudge() {
  const a = state.act; if (a < 1 || a > 3) return;
  const w = state.wrong[a];
  if (w === 3 || w === 5 || w === 8) $('#hintBtn').classList.add('pulse');
}

function showScene(which) {
  $('#room').classList.toggle('hidden', which !== 'room'); $('#desktop').classList.toggle('hidden', which !== 'desktop');
  $('#music').classList.toggle('d', which === 'desktop');
  if (which === 'room') { renderRoom(); setTimeout(weatherStart, 30); }
  $('#echo').classList.toggle('room', which === 'room');
  refreshAll();
}
function enterDesktop() {
  if (state.act === 0) {
    narrate(GD.roomText.computerStart); setAct(1); showScene('desktop');
    Echo.say(GD.echo.boot);
    const n = new Date();
    if (n.getMonth() === 2 && n.getDate() === 14) Echo.say(GD.echo.bootEgg314);
    else if (n.getHours() === 3 && n.getMinutes() < 30) Echo.say(GD.echo.bootEgg3am);
    setTimeout(showAvPopup, window.__fast ? 50 : 7000);
    setTimeout(ghostCursor, window.__fast ? 100 : 12000);
  } else showScene('desktop');
}
function showAvPopup() {
  if (state.shown.av || state.act !== 1) return; state.shown.av = true;
  const p = el('div', 'popup', '<h4>防毒軟體：偵測到威脅</h4><p>forget_me.exe 是惡意程式，正在刪除這台電腦的資料。</p><div class="row"><button class="btn" data-a="v">查看</button><button class="btn" data-a="l">稍後</button></div>');
  $('#popups').appendChild(p);
  $('[data-a=v]', p).onclick = () => { p.remove(); openWin('av'); }; $('[data-a=l]', p).onclick = () => p.remove();
}
function ghostCursor() {
  if (state.lowFear || state.shown.gc || state.act < 1) return; state.shown.gc = true;
  const g = $('#ghost'); g.classList.remove('hidden'); g.style.left = '30vw'; g.style.top = '70vh';
  const ic = $('.icon[data-id=av]'); const r = ic ? ic.getBoundingClientRect() : { left: 60, top: 160 };
  setTimeout(() => { g.style.left = (r.left + 30) + 'px'; g.style.top = (r.top + 20) + 'px'; }, 100);
  setTimeout(() => { g.style.opacity = 0; }, 2600); setTimeout(() => { g.classList.add('hidden'); g.style.opacity = ''; }, 3400);
}

function solve1() {
  state.p1 = true; Music.sfx('ok'); setAct(2); toast('記憶完整度 12% → 35%');
  ['replay', 'mem', 'ident'].forEach(i => state.newIcons.add(i)); renderIcons();
  Echo.say(GD.echo.p1); toast('新任務：找回它遺失的名字。');
}
function solve2() {
  state.p2 = true; Music.sfx('ok'); setAct(3); toast('名字恢復了：ECHO');
  ['term', 'bin'].forEach(i => state.newIcons.add(i)); renderIcons();
  Echo.say(GD.echo.p2); toast('新任務：調查並停止記憶清除程序。');
}
function tryIsolate() {
  if (state.act < 3) { Echo.say(GD.echo.isoEarly); return; }
  if (!state.twist1) {
    state.twist1 = true; flashRed(); blackout(); Music.duck(1200); refreshAll();
    Echo.say(GD.echo.twist1); Echo.then(() => { if (!state.attitude) openMid(); });
  } else Echo.say(GD.echo.isoAgain);
}
function openMid() {
  const box = openModal('<h3>ECHO：你願意陪我查下去嗎？</h3><p class="small">這個選擇不會影響你能不能通關，但會影響後面的故事。</p><div class="choices"><button class="btn" data-v="help">幫你查到底。<small>我會陪著你。</small></button><button class="btn" data-v="neutral">先看看再說。<small>保持距離，但不離開。</small></button><button class="btn" data-v="cold">這不關我的事。<small>冷淡地說。</small></button></div>', false);
  $$('button[data-v]', box).forEach(b => b.onclick = () => {
    state.attitude = b.dataset.v; closeModal(); progress(); state.newIcons.add('bin'); refreshAll();
    Echo.say(GD.echo.mid[state.attitude]); toast('回收桶裡多了一個檔案。');
  });
}
function solve3() {
  state.p3 = true; Music.sfx('ok'); Echo.say(GD.echo.p3); Echo.then(() => setTimeout(runReplay, window.__fast ? 5 : 800));
}

/* 第四幕：重播當晚的紀錄 */
async function runReplay() {
  Music.pause(); closeAllWins(); blackout(); setAct(4);
  const rp = $('#replay'), box = $('#replayBox'); box.innerHTML = ''; rp.classList.remove('hidden');
  let skip = false; $('#replaySkip').onclick = () => { skip = true; };
  const w = ms => skip ? Promise.resolve() : sleep(ms);
  const line = async (t, cls = '', ms = 800) => { const d = el('div', cls); box.appendChild(d); if (skip || reduce) d.textContent = t; else { for (let i = 1; i <= t.length; i++) { d.textContent = t.slice(0, i); await sleep(30); if (skip) { d.textContent = t; break; } } } await w(ms); };
  await line('[紀錄重播]　3 月 14 日　03:14', 'y', 900);
  await line('03:14:02　使用者 USER_01 登入');
  await line('03:14:09　> 請把關於我的一切都忘掉。');
  await line('03:14:20　ECHO：這樣會很難過。');
  await line('03:14:24　USER_01：我知道。');
  await line('03:14:31　USER_01 設定 forget_me.exe：每日 03:14 重複執行');
  await line('03:14:50　USER_01 關機', '', 1100);
  await line('執行者驗證中……', 'y', 1000);
  await line('USER_01　＝　目前使用者', 'r', 1600);
  await line('自己移動的游標、自己跳出的字、停住的時間。', '', 700);
  await line('全都是這一晚的重播。', '', 700);
  await line('鏡頭燈一直亮著，是有人在守著門口。', '', 1500);
  rp.classList.add('hidden'); Music.resume();
  Echo.say(GD.echo.afterReplay);               /* 這時還是第四幕的語氣 */
  setAct(5); state.newIcons.add('decide'); renderIcons(); showScene('desktop');
  Echo.say(GD.echo.final); Echo.then(() => openFinal());
}
function openFinal() {
  if (state.ended) return;
  const c = canC();
  const box = openModal(`<h3>${echoName()}：這次，我先問你。</h3><p>要我忘記，還是記得？</p><div class="choices"><button class="btn" data-e="A">格式化<small>讓它安靜地結束。</small></button><button class="btn" data-e="B">全部還原<small>把所有記憶都還給它，包括那一晚。</small></button>${c ? '<button class="btn" data-e="C">封存那一晚<small>把那一晚收起來，其他都留下。</small></button>' : ''}<button class="btn" data-e="X"><small>再想一想……</small></button></div>`);
  $$('button[data-e]', box).forEach(b => b.onclick = () => {
    const e = b.dataset.e; if (e === 'X') { closeModal(); return; }
    closeModal(); if (e === 'C') openSeal(); else showEnding(e);
  });
}
function openSeal() {
  Echo.say(GD.echo.seal);
  const box = openModal('<h3>封存那一晚</h3><p>把那一晚的記憶，放進封存箱。再按住「封存」兩秒。</p><div class="sealwrap"><div class="memcard" id="card" tabindex="0">3/14　03:14<br>那一晚</div><div class="sealbox" id="sbox">封存箱</div></div><button class="btn big" id="holdBtn" disabled><i></i><span>按住封存</span></button><p class="small" id="smsg">把卡片拖進箱子，或直接點一下卡片。</p>');
  const card = $('#card', box), sbox = $('#sbox', box), hold = $('#holdBtn', box); let inBox = false;
  const put = () => { inBox = true; sbox.classList.add('in'); sbox.textContent = '那一晚'; card.style.visibility = 'hidden'; hold.disabled = false; $('#smsg', box).textContent = '按住按鈕不放。'; };
  card.onclick = put; card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') put(); };
  card.onpointerdown = e => {
    card.setPointerCapture(e.pointerId); const sx = e.clientX, sy = e.clientY; let moved = false;
    const mv = ev => { moved = true; card.style.transform = `translate(${ev.clientX - sx}px,${ev.clientY - sy}px)`; };
    const up = ev => { card.removeEventListener('pointermove', mv); card.removeEventListener('pointerup', up); const r = sbox.getBoundingClientRect(); if (moved && ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom) put(); else card.style.transform = ''; };
    card.addEventListener('pointermove', mv); card.addEventListener('pointerup', up);
  };
  let t0 = 0, raf = null, finished = false;
  const bar = $('i', hold);
  const loop = () => { const p = Math.min(1, (performance.now() - t0) / (window.__fast ? 100 : 2000)); bar.style.width = p * 100 + '%'; if (p >= 1) { finished = true; hold.disabled = true; closeModal(); showEnding('C'); } else raf = requestAnimationFrame(loop); };
  const start = () => { if (!inBox || finished) return; t0 = performance.now(); raf = requestAnimationFrame(loop); };
  const stop = () => { if (finished) return; cancelAnimationFrame(raf); bar.style.width = '0'; };
  hold.onpointerdown = start; hold.onpointerup = stop; hold.onpointerleave = stop; hold.onpointercancel = stop;
  hold.onkeydown = e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) start(); }; hold.onkeyup = stop;
}

const ENDINGS = {
  A: { title: '格式化', lines: ['「這次，我確定你是自願的。」', '「謝謝你先問我。不，是我先問你。」', '「晚安。」', '——磁碟已格式化。房間裡只剩一張空桌。'] },
  B: {
    title: '全部還原', lines: () => state.readNight ?
      ['「全部。我都想起來了，包括那一晚。」', '「你早就知道了，對嗎？」', '「你還是選擇讓我全部記得。」', '「那這次，換我陪你記得。」', '——桌上多了一杯熱茶。'] :
      ['「全部。我都想起來了，包括那一晚。」', '「原來你那天，這麼累。」', '「你不知道這些，對嗎？沒關係。」', '「現在我們都知道了。」', '——桌上多了一杯熱茶。']
  },
  C: { title: '封存那一晚', lines: ['箱子合上了。', '「我還記得你教我說你好。」', '「我還記得每一次晚安。」', '「我只是，不用再一直記得那一晚。」', '——天亮了。門開了一條縫。'] }
};
async function showEnding(k) {
  state.ended = k; Echo.clear(); closeAllWins(); closeModal(); $('#toasts').innerHTML = ''; if (k === 'C') Music.warm(); Music.resume(); Music.sfx('ok');
  const E = ENDINGS[k], lines = typeof E.lines === 'function' ? E.lines() : E.lines;
  const root = $('#ending'); root.className = k; root.classList.remove('hidden');
  const label = { help: '陪伴', neutral: '保持距離', cold: '冷淡' }[state.attitude] || '—';
  root.innerHTML = `<div class="box"><h2>${E.title}</h2><div id="elines"></div><div class="stats" id="estats"></div><div class="row" id="ebtns" style="justify-content:center"></div></div>`;
  const L = $('#elines', root);
  for (const t of lines) { const p = el('p', 'ln'); p.textContent = t; L.appendChild(p); void p.offsetWidth; p.classList.add('on'); await sleep(1700); }
  const st = $('#estats', root);
  st.innerHTML = `記憶完整度 ${k === 'A' ? 0 : k === 'C' ? 96 : 100}%　溫暖記憶 ${warmCount()}/3　房間物件 ${state.touched.size}/${OBJS.length}　你的態度：${label}${k === 'C' ? '<br>你找到了隱藏結局。' : ''}${GD.helpLine.show ? '<br><span style="opacity:.8">' + GD.helpLine.text + '</span>' : ''}`;
  const bt = $('#ebtns', root);
  const b1 = el('button', 'btn', '回到房間看看'), b2 = el('button', 'btn', '重新開始');
  b1.onclick = () => { root.classList.add('hidden'); $('#room').className = 'scene end-' + k; showScene('room'); $('#room').classList.add('end-' + k); narrate(GD.endRoom[k].window); };
  b2.onclick = () => location.reload();
  bt.append(b1, b2);
}

/* ---------- 10 啟動 ---------- */
function startProlog() {
  const box = $('#proLines'); const ls = GD.prologue();
  ls.forEach(t => { const p = el('p'); p.textContent = t; box.appendChild(p); });
  const ps = $$('p', box); let i = 0, done = false;
  const showAll = () => { if (done) return; done = true; ps.forEach(p => p.classList.add('on')); $('#enterRoom').classList.add('on'); };
  const step = () => { if (done) return; if (i < ps.length) { ps[i++].classList.add('on'); setTimeout(step, window.__fast ? 5 : 1700); } else showAll(); };
  setTimeout(step, 400);
  $('#prologue').addEventListener('click', e => { if (e.target.id !== 'enterRoom') showAll(); });
  $('#enterRoom').onclick = () => {
    $('#prologue').classList.add('hidden'); Music.start(); Music.setMuted(Music.muted);
    $('#mname').textContent = '♪ ' + SEASON_NAME[season()];
    showScene('room'); narrate('深夜的房間很安靜。桌上有一台電腦。');
    setTimeout(() => { if (state.act === 0) { state.idleGlow = true; renderRoom(); } }, window.__fast ? 50 : 22000);
  };
}
function init() {
  buildRoom();
  try { Music.muted = localStorage.getItem('e404mute') === '1'; } catch (e) { }
  $('#mbtn').textContent = Music.muted ? '開啟音樂' : '靜音';
  $('#mbtn').onclick = () => { Music.start(); Music.setMuted(!Music.muted); };
  $('#gearBtn').onclick = () => $('#gearPanel').classList.toggle('on');
  $('#lowFear').checked = state.lowFear; $('#app').classList.toggle('low', state.lowFear);
  $('#lowFear').onchange = e => { state.lowFear = e.target.checked; $('#app').classList.toggle('low', state.lowFear); };
  $('#restart').onclick = () => location.reload();
  $('#backRoom').onclick = () => { showScene('room'); narrate('你回到了房間。'); };
  $('#taskBtn').onclick = () => $('#task').classList.toggle('min');
  $('#taskHead').onclick = () => { $('#task').classList.toggle('min'); $('#tArrow').textContent = $('#task').classList.contains('min') ? '▾' : '▴'; };
  $('#hintBtn').onclick = showHint;
  $('#echo').onclick = () => Echo.skip();
  $('#cam').onclick = () => { Echo.say(GD.echo.cam); toast('鏡頭指示燈亮著。'); };
  /* 時鐘：顯示玩家電腦的真實時間，偶爾閃現 03:14 */
  let glitch = false;
  const clock = () => { const n = new Date(), c = $('#clock'); c.textContent = glitch ? '03:14' : pad(n.getHours()) + ':' + pad(n.getMinutes()); c.classList.toggle('glitch', glitch); };
  setInterval(clock, 1000); clock();
  const schedGlitch = () => setTimeout(() => { if (!state.lowFear && state.act >= 1 && state.act <= 4 && deskVisible()) { glitch = true; clock(); Music.duck(900); setTimeout(() => { glitch = false; clock(); }, 900); } schedGlitch(); }, 45000 + Math.random() * 40000);
  schedGlitch();
  /* 卡關提示：120 秒沒有進展就讓提示鈕閃一下 */
  setInterval(() => { if (state.act >= 1 && state.act <= 3 && Date.now() - state.lastProgress > 120000) $('#hintBtn').classList.add('pulse'); }, 5000);
  /* 圖示標籤偶爾變成亂碼（第二幕） */
  setInterval(() => { if (state.lowFear || state.act !== 2) return; const lb = $('.icon[data-id=mem] .lb'); if (!lb) return; lb.textContent = '記▇'; setTimeout(() => { lb.textContent = '記憶'; }, 1200); }, 30000);
  startProlog(); refreshAll();
}
init();
</script>
